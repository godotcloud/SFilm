# ==============================================================================
# Spektrafilm iOS Native App — Self-Contained Extraction-Free GitHub Actions Workflow
# 自包含免解压 GitHub Actions 编译工作流 (.github/workflows/build.yml)
#
# 修复说明 (Fix for Line 71 Exceeded max expression length 21000)：
# - GitHub Actions 解析器在遇到包含 `${{ ... }}` 的 `run:` 块时，会将整个 `run:` 脚本
#   转换为单个内部 `format()` 表达式，并强制执行 21,000 字符上限检查。
# - 本版本将自包含源码生成拆分为 4 个独立子步骤（Metal 着色器、Swift 数据与渲染引擎、
#   SwiftUI 暗房界面、Info.plist 与 XcodeGen 配置），彻底移除大脚本内的 `${{ ... }}`
#   内联表达式（改用环境变量注入），且每个步骤的脚本长度均严格控制在 15,000 字符以内。
#
# 上游致谢与开源许可 (GPL-3.0)：
# - Film modeling powered by spektrafilm (Andrea Volpato): https://github.com/andreavolpato/spektrafilm
# - spektrafilm OFX Metal Reference: https://github.com/chaert-s/spektrafilm-ofx
# - darktable spektrafilm documentation: https://docs.darktable.org/usermanual/development/en/module-reference/processing-modules/spektrafilm/
# ==============================================================================

name: Build Spektrafilm iOS (iPhone 13 Pro Max Self-Contained)

on:
  workflow_dispatch:
    inputs:
      ios_deployment_target:
        description: "iOS Deployment Target (iPhone 13 Pro Max 推荐 16.0 或 17.0)"
        required: false
        default: "16.0"
      publish_release_ipa:
        description: "是否同步发布免解压 .ipa 到 GitHub Releases (Safari 免解压直下)"
        required: false
        default: "true"
  push:
    branches: [ main, master ]
    paths:
      - ".github/workflows/build.yml"
      - "Sources/**"
      - "project.yml"

permissions:
  contents: write

env:
  APP_NAME: "Spektrafilm"
  BUNDLE_ID: "org.pixls.spektrafilm.ios"
  TARGET_DEVICE_MODEL: "iPhone14,3"

jobs:
  build-ios-ipa:
    name: Compile Native iOS App (arm64 / A15 Metal)
    runs-on: macos-14

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install XcodeGen & ldid (Brew)
        run: |
          set -euo pipefail
          which xcodegen || brew install xcodegen
          which ldid || brew install ldid
          xcodebuild -version

      - name: 3a. Generate Metal Spectral Shader (SpektrafilmEngine.metal)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Sources Resources
          if [ ! -f "Sources/SpektrafilmEngine.metal" ]; then
          echo "Generating Sources/SpektrafilmEngine.metal..."
          cat << 'EOF_METAL' > Sources/SpektrafilmEngine.metal
          //  SpektrafilmEngine.metal — iPhone 13 Pro Max (A15 Bionic 5-Core GPU)
          //  Film modeling powered by spektrafilm — https://github.com/andreavolpato/spektrafilm (GPL-3.0)
          #include <metal_stdlib>
          using namespace metal;

          struct SpektrafilmUniforms {
              int filmStockID;
              int printPaperID;
              int processMode;
              float frameLongEdgeMM;

              float wbTemperatureOffset;
              float wbTintOffset;
              int balanceToFilmStock;

              float filmExposureEV;
              float pushPullStops;
              float developmentGamma;
              float fastLayerGamma;
              float slowLayerGamma;
              float developerExhaustion;
              float dirStrength;
              float sameLayerInhibition;
              float interlayerInhibition;
              float inhibitorSpreadUm;
              int enableCameraDiffusion;
              int cameraDiffusionType;
              float cameraDiffusionStrength;
              float cameraDiffusionSize;
              float cameraDiffusionWarmth;

              int enableHalationScatter;
              float scatterAmount;
              float scatterSize;
              float halationStrength;
              float halationSize;
              float highlightBoostEV;
              float boostRange;
              float boostProtectStops;

              float printExposureEV;
              int autoPrintExposure;
              float printGamma;
              float printGammaR;
              float printGammaG;
              float printGammaB;
              float filtrationM;
              float filtrationY;
              float preflashExposure;
              float preflashM;
              float preflashY;
              int enablePrintDiffusion;
              float printDiffusionStrength;
              float printDiffusionSize;
              float printDiffusionWarmth;

              int enableGrain;
              float granularity;
              float grainStrength;
              float uniformity;
              float sublayerScale;
              float densityFloor;
              float grainBlur;
              float dyeCloudSize;
              float recoveryRadius;
              float recoveryStrength;
              uint randomSeed;

              int enableGamutCompression;
              float preCompressionBoost;
              float postCompressionScale;
              float scannerBlur;
              float scannerSharpenRadius;
              float scannerSharpenStrength;
              float viewingGlare;
              int blackPointCorrection;
              float blackLevel;
              int whitePointCorrection;
              float whiteLevel;
              int outputColorSpace;
              int splitPreviewMode;
              float splitPosition;

              float3 filmDmin;
              float3 filmDmax;
              float3 filmSlope;
              float3 filmSensShift;
              float3 filmHalationRatio;
              float filmBaseRMSGranularity;
              int filmIsReversal;
              int filmIsBlackAndWhite;
              int filmIsTungsten;

              float3 paperDmin;
              float3 paperDmax;
              float3 paperSlope;
              float3 paperCrossMatrixRow0;
              float3 paperCrossMatrixRow1;
              float3 paperCrossMatrixRow2;

              float3 filmMatrixRow0;
              float3 filmMatrixRow1;
              float3 filmMatrixRow2;
          };

          inline uint pcg_hash(uint input) {
              uint state = input * 747796405u + 2891336453u;
              uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
              return (word >> 22u) ^ word;
          }

          inline float rand_uniform(uint2 gid, uint channel, uint layer, uint seed) {
              uint h = pcg_hash(gid.x + pcg_hash(gid.y + pcg_hash(channel * 17u + layer * 31u + seed)));
              return float(h) * (1.0f / 4294967295.0f);
          }

          inline float rand_gaussian(uint2 gid, uint channel, uint layer, uint seed) {
              float u1 = max(rand_uniform(gid, channel, layer * 2u, seed), 1e-6f);
              float u2 = rand_uniform(gid, channel, layer * 2u + 1u, seed);
              return sqrt(-2.0f * log(u1)) * cos(6.283185307f * u2);
          }

          inline float3 evaluate_hd_curve(
              float3 logE, float3 dmin, float3 dmax, float3 baseSlope,
              float devGamma, float fastGamma, float slowGamma, float exhaustion, int isReversal
          ) {
              float3 span = max(dmax - dmin, float3(0.1f));
              float3 x = logE * (baseSlope * devGamma);
              float3 slowPart = tanh(x * slowGamma * 0.85f);
              float3 fastPart = tanh((x - 0.35f) * fastGamma * 0.75f);
              float3 normalized = clamp(0.5f + 0.32f * slowPart + 0.22f * fastPart, 0.0f, 1.0f);
              if (isReversal != 0) normalized = 1.0f - normalized;
              if (exhaustion > 0.0001f) {
                  normalized = normalized / (1.0f + exhaustion * 0.45f * normalized * normalized);
              }
              return dmin + span * normalized;
          }

          inline float3 apply_oklch_gamut_compression(float3 rgb) {
              float l = 0.4122214708f * rgb.r + 0.5363325363f * rgb.g + 0.0514459929f * rgb.b;
              float m = 0.2119034982f * rgb.r + 0.6806995451f * rgb.g + 0.1073969566f * rgb.b;
              float s = 0.0883024619f * rgb.r + 0.2817188376f * rgb.g + 0.6299787005f * rgb.b;
              float l_ = cbrt(max(l, 0.0f)), m_ = cbrt(max(m, 0.0f)), s_ = cbrt(max(s, 0.0f));
              float L = 0.2104542553f * l_ + 0.7936177850f * m_ - 0.0040720468f * s_;
              float a = 1.9779984951f * l_ - 2.4285922050f * m_ + 0.4505937099f * s_;
              float b = 0.0259040371f * l_ + 0.7827717662f * m_ - 0.8086757660f * s_;
              float C = sqrt(a * a + b * b);
              if (C > 0.0001f) {
                  float maxC = 0.28f;
                  float scale = (maxC * tanh(C / maxC)) / C;
                  a *= scale;
                  b *= scale;
              }
              L = L / (1.0f + 0.18f * max(L - 0.75f, 0.0f));
              float l_o = L + 0.3963377774f * a + 0.2158037573f * b;
              float m_o = L - 0.1055613458f * a - 0.0638541728f * b;
              float s_o = L - 0.0894841775f * a - 1.2914855480f * b;
              float l3 = l_o * l_o * l_o, m3 = m_o * m_o * m_o, s3 = s_o * s_o * s_o;
              return max(float3(
                  +4.0767416621f * l3 - 3.3077115913f * m3 + 0.2309699292f * s3,
                  -1.2684380046f * l3 + 2.6097574011f * m3 - 0.3413193965f * s3,
                  -0.0041960863f * l3 - 0.7034186147f * m3 + 1.7076147010f * s3
              ), float3(0.0f));
          }

          inline float3 linear_to_srgb(float3 x) {
              float3 c = clamp(x, 0.0f, 1.0f);
              return select(c * 12.92f, 1.055f * pow(c, float3(1.0f / 2.4f)) - 0.055f, c > 0.0031308f);
          }

          inline float3 srgb_to_linear(float3 x) {
              float3 c = clamp(x, 0.0f, 1.0f);
              return select(c / 12.92f, pow((c + 0.055f) / 1.055f, float3(2.4f)), c > 0.04045f);
          }

          inline float3 sample_spatial_blur(
              texture2d<float, access::sample> tex, sampler s, float2 uv, float2 texelSize, float radiusPx
          ) {
              if (radiusPx <= 0.05f) return srgb_to_linear(tex.sample(s, uv).rgb);
              const float2 offsets[8] = {
                  float2(1.0f, 0.0f), float2(-1.0f, 0.0f), float2(0.0f, 1.0f), float2(0.0f, -1.0f),
                  float2(0.707f, 0.707f), float2(-0.707f, 0.707f), float2(0.707f, -0.707f), float2(-0.707f, -0.707f)
              };
              float3 accum = srgb_to_linear(tex.sample(s, uv).rgb) * 0.28f;
              float weightSum = 0.28f;
              for (int i = 0; i < 8; ++i) {
                  float ringScale = (i < 4) ? 0.65f : 1.25f;
                  float w = (i < 4) ? 0.11f : 0.07f;
                  float2 sampleUV = clamp(uv + offsets[i] * texelSize * radiusPx * ringScale, 0.0f, 1.0f);
                  accum += srgb_to_linear(tex.sample(s, sampleUV).rgb) * w;
                  weightSum += w;
              }
              return accum / weightSum;
          }

          kernel void spektrafilm_pipeline(
              texture2d<float, access::sample> inTexture [[texture(0)]],
              texture2d<float, access::write> outTexture [[texture(1)]],
              constant SpektrafilmUniforms& u [[buffer(0)]],
              uint2 gid [[thread_position_in_grid]]
          ) {
              uint width = outTexture.get_width(), height = outTexture.get_height();
              if (gid.x >= width || gid.y >= height) return;

              constexpr sampler texSampler(coord::normalized, address::clamp_to_edge, filter::linear);
              float2 uv = (float2(gid) + 0.5f) / float2(float(width), float(height));
              float2 texelSize = 1.0f / float2(float(width), float(height));

              float4 srcPixel = inTexture.sample(texSampler, uv);
              float3 sceneLinear = srgb_to_linear(srcPixel.rgb);

              if (u.splitPreviewMode == 1 && uv.x < u.splitPosition) {
                  if (abs(uv.x - u.splitPosition) < texelSize.x * 2.0f) {
                      outTexture.write(float4(0.95f, 0.78f, 0.25f, 1.0f), gid);
                  } else {
                      outTexture.write(srcPixel, gid);
                  }
                  return;
              }

              float formatScale = 36.0f / max(u.frameLongEdgeMM, 4.0f);
              float pxScale = float(max(width, height)) / 2000.0f;

              float3 wbGain = float3(
                  1.0f + u.wbTemperatureOffset * 0.35f + u.wbTintOffset * 0.15f,
                  1.0f - u.wbTintOffset * 0.20f,
                  1.0f - u.wbTemperatureOffset * 0.35f + u.wbTintOffset * 0.15f
              );
              if (u.balanceToFilmStock != 0 && u.filmIsTungsten != 0) wbGain *= float3(1.32f, 1.02f, 0.72f);
              sceneLinear = max(sceneLinear * wbGain, float3(1e-5f));

              if (abs(u.highlightBoostEV) > 0.001f) {
                  float luma = dot(sceneLinear, float3(0.2126f, 0.7152f, 0.0722f));
                  float threshold = 0.18f * exp2(u.boostProtectStops);
                  if (luma > threshold) {
                      float excess = (luma - threshold) / max(u.boostRange, 0.2f);
                      sceneLinear *= exp2(u.highlightBoostEV * tanh(excess));
                  }
              }

              if (u.enableCameraDiffusion != 0 && u.cameraDiffusionStrength > 0.001f) {
                  float diffRadius = u.cameraDiffusionSize * 14.0f * formatScale * pxScale;
                  float3 halo = sample_spatial_blur(inTexture, texSampler, uv, texelSize, diffRadius) * wbGain;
                  float3 warmthTint = float3(1.0f + 0.18f * u.cameraDiffusionWarmth, 1.0f, 1.0f - 0.18f * u.cameraDiffusionWarmth);
                  float blendAmt = clamp(u.cameraDiffusionStrength * 0.45f, 0.0f, 0.85f);
                  if (u.cameraDiffusionType == 0) {
                      sceneLinear = mix(sceneLinear, sceneLinear + max(halo - 0.12f, 0.0f) * warmthTint * 0.85f, blendAmt);
                  } else if (u.cameraDiffusionType == 1) {
                      sceneLinear = mix(sceneLinear, halo * warmthTint, blendAmt * 0.65f);
                  } else {
                      sceneLinear = mix(sceneLinear, halo * warmthTint + float3(0.015f * blendAmt), blendAmt);
                  }
              }

              float3 filmIrradiance = max(float3(
                  dot(u.filmMatrixRow0, sceneLinear),
                  dot(u.filmMatrixRow1, sceneLinear),
                  dot(u.filmMatrixRow2, sceneLinear)
              ), float3(1e-5f));

              if (u.enableHalationScatter != 0) {
                  if (u.scatterAmount > 0.001f) {
                      float scatterRad = u.scatterSize * 6.0f * formatScale * pxScale;
                      float3 scattered = sample_spatial_blur(inTexture, texSampler, uv, texelSize, scatterRad) * wbGain;
                      filmIrradiance = mix(filmIrradiance, max(scattered, float3(1e-5f)), clamp(u.scatterAmount * 0.18f, 0.0f, 0.5f));
                  }
                  if (u.halationStrength > 0.001f) {
                      float halRad = u.halationSize * 22.0f * formatScale * pxScale;
                      float3 halBlur = sample_spatial_blur(inTexture, texSampler, uv, texelSize, halRad) * wbGain;
                      filmIrradiance += max(halBlur - float3(0.18f), float3(0.0f)) * u.filmHalationRatio * (u.halationStrength * 4.5f);
                  }
              }

              float effectiveFilmEV = u.filmExposureEV - u.pushPullStops + 0.75f;
              float effectiveDevGamma = u.developmentGamma * pow(1.15f, u.pushPullStops);
              float3 logExposure = log10(filmIrradiance * exp2(effectiveFilmEV)) + u.filmSensShift;

              float3 filmDensity = evaluate_hd_curve(
                  logExposure, u.filmDmin, u.filmDmax, u.filmSlope,
                  effectiveDevGamma, u.fastLayerGamma, u.slowLayerGamma, u.developerExhaustion, u.filmIsReversal
              );

              if (u.dirStrength > 0.001f && u.filmIsReversal == 0) {
                  float3 netDensity = max(filmDensity - u.filmDmin, float3(0.0f));
                  float meanDensity = (netDensity.r + netDensity.g + netDensity.b) / 3.0f;
                  float spreadPx = (u.inhibitorSpreadUm / 25.0f) * formatScale * pxScale;
                  float3 neighborRGB = sample_spatial_blur(inTexture, texSampler, uv, texelSize, spreadPx) * wbGain;
                  float3 neighborLogE = log10(max(neighborRGB * exp2(effectiveFilmEV), float3(1e-5f))) + u.filmSensShift;
                  float3 neighborD = evaluate_hd_curve(
                      neighborLogE, u.filmDmin, u.filmDmax, u.filmSlope,
                      effectiveDevGamma, u.fastLayerGamma, u.slowLayerGamma, u.developerExhaustion, 0
                  );
                  float3 interlayerShift = (netDensity - float3(meanDensity)) * (u.interlayerInhibition * 0.38f * u.dirStrength);
                  float3 spatialEdgeBoost = (filmDensity - neighborD) * (0.28f * u.dirStrength) - netDensity * (u.sameLayerInhibition * 0.08f * u.dirStrength);
                  filmDensity = clamp(filmDensity + interlayerShift + spatialEdgeBoost, u.filmDmin, u.filmDmax);
              }

              if (u.enableGrain != 0 && u.grainStrength > 0.001f) {
                  float3 normD = clamp((filmDensity - u.filmDmin) / max(u.filmDmax - u.filmDmin, float3(0.1f)), 0.0f, 1.0f);
                  float3 crystalEnvelope = pow(normD * (1.0f - normD * 0.65f * clamp(u.uniformity, 0.2f, 2.0f)), float3(0.65f))
                                         + float3(0.08f * u.densityFloor);
                  float3 noiseCoarse = float3(
                      rand_gaussian(gid / 2u, 0u, 0u, u.randomSeed),
                      rand_gaussian(gid / 2u, 1u, 0u, u.randomSeed),
                      rand_gaussian(gid / 2u, 2u, 0u, u.randomSeed)
                  );
                  float3 noiseFine = float3(
                      rand_gaussian(gid, 0u, 1u, u.randomSeed),
                      rand_gaussian(gid, 1u, 1u, u.randomSeed),
                      rand_gaussian(gid, 2u, 1u, u.randomSeed)
                  );
                  float3 combinedNoise = mix(noiseCoarse, noiseFine, clamp(u.sublayerScale * 0.5f, 0.0f, 0.85f));
                  float rmsScale = u.filmBaseRMSGranularity * pow(max(u.granularity, 0.1f), 0.75f) * u.grainStrength * formatScale;
                  filmDensity = clamp(filmDensity + combinedNoise * crystalEnvelope * rmsScale, u.filmDmin, u.filmDmax);
              }

              float3 filmTransmittance = pow(float3(10.0f), -(filmDensity - u.filmDmin));
              float3 scannedLinearRGB;

              if (u.printPaperID == 0 || u.processMode == 1 || u.filmIsReversal != 0) {
                  if (u.filmIsReversal != 0) {
                      scannedLinearRGB = filmTransmittance;
                  } else {
                      float3 normNeg = clamp((filmDensity - u.filmDmin) / max(u.filmDmax - u.filmDmin, float3(0.1f)), 0.0f, 1.0f);
                      scannedLinearRGB = pow(normNeg, float3(1.65f));
                  }
              } else {
                  float autoCompEV = (u.autoPrintExposure != 0) ? (-u.filmExposureEV + u.pushPullStops) : 0.0f;
                  float3 dichroicFilter = float3(1.0f, exp2(-u.filtrationM * 0.025f), exp2(-u.filtrationY * 0.025f));
                  float3 enlargerLight = filmTransmittance * dichroicFilter * exp2(u.printExposureEV + autoCompEV);
                  if (u.preflashExposure > 0.0001f) {
                      float3 preflashFilter = float3(1.0f, exp2(-u.preflashM * 0.025f), exp2(-u.preflashY * 0.025f));
                      enlargerLight += preflashFilter * (u.preflashExposure * 0.08f);
                  }
                  float3 paperExposure = max(float3(
                      dot(u.paperCrossMatrixRow0, enlargerLight),
                      dot(u.paperCrossMatrixRow1, enlargerLight),
                      dot(u.paperCrossMatrixRow2, enlargerLight)
                  ), float3(1e-6f));
                  float3 paperLogE = -log10(paperExposure);
                  float3 channelGamma = float3(u.printGammaR, u.printGammaG, u.printGammaB) * u.printGamma;
                  float3 paperNorm = clamp(0.5f + 0.5f * tanh((paperLogE - 0.42f) * u.paperSlope * channelGamma * 1.35f), 0.0f, 1.0f);
                  float3 paperDensity = u.paperDmin + max(u.paperDmax - u.paperDmin, float3(0.2f)) * paperNorm;
                  scannedLinearRGB = pow(float3(10.0f), -(paperDensity - u.paperDmin));

                  if (u.enablePrintDiffusion != 0 && u.printDiffusionStrength > 0.001f) {
                      scannedLinearRGB = mix(scannedLinearRGB, scannedLinearRGB * (1.0f - 0.18f * u.printDiffusionStrength), clamp(u.printDiffusionStrength * 0.5f, 0.0f, 0.7f));
                  }
                  if (u.viewingGlare > 0.0001f) {
                      scannedLinearRGB += float3(u.viewingGlare * 0.04f) * (1.0f - scannedLinearRGB);
                  }
              }

              if (u.filmIsBlackAndWhite != 0) {
                  float bwLuma = dot(scannedLinearRGB, float3(0.299f, 0.587f, 0.114f));
                  float3 paperTint = clamp(float3(1.0f + u.filtrationY * 0.004f, 1.0f - u.filtrationM * 0.003f, 1.0f - u.filtrationY * 0.005f), 0.75f, 1.25f);
                  scannedLinearRGB = float3(bwLuma) * paperTint;
              }

              if (abs(u.preCompressionBoost) > 0.001f) scannedLinearRGB *= exp2(u.preCompressionBoost * 0.65f);
              if (u.enableGamutCompression != 0) scannedLinearRGB = apply_oklch_gamut_compression(scannedLinearRGB);
              scannedLinearRGB *= max(u.postCompressionScale, 0.1f);

              if (u.blackPointCorrection != 0 || u.whitePointCorrection != 0) {
                  float bPt = (u.blackPointCorrection != 0) ? (u.blackLevel * 0.08f) : 0.0f;
                  float wPt = (u.whitePointCorrection != 0) ? max(u.whiteLevel, 0.25f) : 1.0f;
                  scannedLinearRGB = clamp((scannedLinearRGB - float3(bPt)) / max(wPt - bPt, 0.1f), 0.0f, 1.5f);
              }

              float totalSharpen = u.scannerSharpenStrength * 0.35f + (u.enableGrain != 0 ? u.recoveryStrength * 0.2f : 0.0f);
              if (totalSharpen > 0.005f) {
                  float3 localBlur = sample_spatial_blur(inTexture, texSampler, uv, texelSize, max(u.scannerSharpenRadius, 1.0f));
                  scannedLinearRGB = max(scannedLinearRGB + (srgb_to_linear(srcPixel.rgb) - localBlur) * totalSharpen * 0.45f, float3(0.0f));
              }

              float3 finalOut = (u.outputColorSpace == 2) ? clamp(scannedLinearRGB, 0.0f, 1.0f) : linear_to_srgb(scannedLinearRGB);
              outTexture.write(float4(finalOut, srcPixel.a), gid);
          }
          EOF_METAL
          fi

      - name: 3b. Generate Swift Data Catalog & Metal Renderer (SpektrafilmCore.swift)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "Sources/SpektrafilmIOSApp.swift" ] && [ ! -f "Sources/SpektrafilmCore.swift" ]; then
          echo "Generating Sources/SpektrafilmCore.swift..."
          cat << 'EOF_CORE' > Sources/SpektrafilmCore.swift
          import SwiftUI
          import Metal
          import MetalKit
          import CoreImage
          import CoreImage.CIFilterBuiltins

          struct SpektrafilmUniforms {
              var filmStockID: Int32 = 0
              var printPaperID: Int32 = 1
              var processMode: Int32 = 0
              var frameLongEdgeMM: Float = 36.0

              var wbTemperatureOffset: Float = 0.0
              var wbTintOffset: Float = 0.0
              var balanceToFilmStock: Int32 = 1

              var filmExposureEV: Float = 0.0
              var pushPullStops: Float = 0.0
              var developmentGamma: Float = 1.0
              var fastLayerGamma: Float = 1.0
              var slowLayerGamma: Float = 1.0
              var developerExhaustion: Float = 0.0
              var dirStrength: Float = 1.0
              var sameLayerInhibition: Float = 0.5
              var interlayerInhibition: Float = 1.0
              var inhibitorSpreadUm: Float = 20.0
              var enableCameraDiffusion: Int32 = 0
              var cameraDiffusionType: Int32 = 0
              var cameraDiffusionStrength: Float = 0.25
              var cameraDiffusionSize: Float = 1.0
              var cameraDiffusionWarmth: Float = 0.0

              var enableHalationScatter: Int32 = 1
              var scatterAmount: Float = 1.0
              var scatterSize: Float = 1.0
              var halationStrength: Float = 1.0
              var halationSize: Float = 1.0
