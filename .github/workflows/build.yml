              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          HStack {
                              Picker("Film", selection: $vm.selectedFilmIndex) {
                                  ForEach(Array(SpektrafilmCatalog.filmStocks.enumerated()), id: \.offset) { idx, s in
                                      Text(s.name).tag(idx)
                                  }
                              }
                              Picker("Paper", selection: $vm.selectedPaperIndex) {
                                  ForEach(Array(SpektrafilmCatalog.printPapers.enumerated()), id: \.offset) { idx, p in
                                      Text(p.name).tag(idx)
                                  }
                              }
                              Picker("Format", selection: $vm.selectedFormatIndex) {
                                  ForEach(Array(SpektrafilmCatalog.filmFormats.enumerated()), id: \.offset) { idx, f in
                                      Text(f.name).tag(idx)
                                  }
                              }
                          }
                          .padding(.horizontal, 8)
                          .padding(.vertical, 6)

                          ZStack {
                              Color.black
                              if let img = vm.renderedUIImage {
                                  Image(uiImage: img)
                                      .resizable()
                                      .scaledToFit()
                              }
                          }
                          .frame(height: 280)

                          Picker("Stage", selection: $activeTab) {
                              ForEach(DarkroomStageTab.allCases) { tab in
                                  Text(tab.rawValue).tag(tab)
                              }
                          }
                          .pickerStyle(.segmented)
                          .padding(8)

                          ScrollView {
                              VStack(spacing: 12) {
                                  switch activeTab {
                                  case .film:
                                      sliderRow("Film Exposure (EV)", value: $vm.uniforms.filmExposureEV, range: -4...4)
                                      sliderRow("Push / Pull (Stops)", value: $vm.uniforms.pushPullStops, range: -2...3)
                                      sliderRow("Development Gamma", value: $vm.uniforms.developmentGamma, range: 0.5...1.6)
                                      sliderRow("DIR Couplers Strength", value: $vm.uniforms.dirStrength, range: 0...1)
                                      sliderRow("Interlayer Saturation", value: $vm.uniforms.interlayerInhibition, range: 0...2)
                                      sliderRow("Inhibitor Spread (µm)", value: $vm.uniforms.inhibitorSpreadUm, range: 2...80)
                                  case .print:
                                      sliderRow("Print Exposure Offset (EV)", value: $vm.uniforms.printExposureEV, range: -3...3)
                                      sliderRow("Filtration Magenta (M)", value: $vm.uniforms.filtrationM, range: -40...40)
                                      sliderRow("Filtration Yellow (Y)", value: $vm.uniforms.filtrationY, range: -40...40)
                                      sliderRow("Print Contrast Gamma", value: $vm.uniforms.printGamma, range: 0.5...1.6)
                                      sliderRow("Preflash Exposure", value: $vm.uniforms.preflashExposure, range: 0...1)
                                  case .grain:
                                      sliderRow("Granularity (Crystal Size)", value: $vm.uniforms.granularity, range: 0.2...3.0)
                                      sliderRow("Grain Strength", value: $vm.uniforms.grainStrength, range: 0...4)
                                      sliderRow("Crystal Uniformity", value: $vm.uniforms.uniformity, range: 0.2...2.0)
                                      sliderRow("Recovery Sharpening", value: $vm.uniforms.recoveryStrength, range: 0...2)
                                  case .halation:
                                      sliderRow("Sideways Scatter Amount", value: $vm.uniforms.scatterAmount, range: 0...2.5)
                                      sliderRow("Red Halation Strength", value: $vm.uniforms.halationStrength, range: 0...4.0)
                                      sliderRow("Halation Size Scale", value: $vm.uniforms.halationSize, range: 0.2...3.0)
                                      sliderRow("Highlight Boost (EV)", value: $vm.uniforms.highlightBoostEV, range: 0...3.0)
                                  case .scanner:
                                      sliderRow("Pre-Compression Boost", value: $vm.uniforms.preCompressionBoost, range: -2...2)
                                      sliderRow("Post-Compression Scale", value: $vm.uniforms.postCompressionScale, range: 0.5...1.5)
                                      sliderRow("Scanner Sharpen Strength", value: $vm.uniforms.scannerSharpenStrength, range: 0...2.0)
                                      sliderRow("Print Viewing Glare", value: $vm.uniforms.viewingGlare, range: 0...1.0)
                                  }
                              }
                              .padding(16)
                          }
                      }
                      .navigationTitle("spektrafilm iOS")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .topBarLeading) {
                              PhotosPicker(selection: $selectedPhotoItem, matching: .images) {
                                  Image(systemName: "photo.on.rectangle")
                              }
                          }
                          ToolbarItem(placement: .topBarTrailing) {
                              Button {
                                  vm.uniforms.splitPreviewMode = (vm.uniforms.splitPreviewMode == 0) ? 1 : 0
                                  vm.renderSimulation()
                              } label: {
                                  Image(systemName: "rectangle.split.2x1")
                              }
                          }
                      }
                      .onChange(of: selectedPhotoItem) { newItem in
                          guard let newItem else { return }
                          Task {
                              if let data = try? await newItem.loadTransferable(type: Data.self) {
                                  vm.loadPhotoData(data)
                              }
                          }
                      }
                  }
                  .preferredColorScheme(.dark)
              }

              private func sliderRow(_ label: String, value: Binding<Float>, range: ClosedRange<Float>) -> some View {
                  VStack(alignment: .leading, spacing: 2) {
                      HStack {
                          Text(label).font(.caption)
                          Spacer()
                          Text(String(format: "%.2f", value.wrappedValue)).font(.caption.monospacedDigit()).foregroundStyle(.orange)
                      }
                      Slider(value: Binding(
                          get: { value.wrappedValue },
                          set: { value.wrappedValue = $0; vm.renderSimulation() }
                      ), in: range)
                      .tint(.orange)
                  }
              }
          }

          @main
          struct SpektrafilmIOSApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF_UI
          fi

      - name: 3d. Generate Info.plist & XcodeGen project.yml
        shell: bash
        env:
          DEPLOY_TARGET: ${{ inputs.ios_deployment_target || '16.0' }}
        run: |
          set -euo pipefail
          cat << 'EOF_PLIST' > Resources/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>Spektrafilm</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.3.3</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>CADisableMinimumFrameDurationOnPhone</key>
              <true/>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Spektrafilm needs access to your Photo Library to import RAW/DNG and photos for spectral film simulation.</string>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>Spektrafilm needs permission to save simulated darkroom prints to your Photo Library.</string>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
                  <string>metal</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF_PLIST

          cat << EOF_PROJ > project.yml
          name: Spektrafilm
          options:
            bundleIdPrefix: org.pixls.spektrafilm
            deploymentTarget:
              iOS: "${DEPLOY_TARGET}"
          settings:
            base:
              ARCHS: arm64
              VALID_ARCHS: arm64
              ONLY_ACTIVE_ARCH: NO
              SWIFT_VERSION: "5.9"
              TARGETED_DEVICE_FAMILY: "1,2"
              MTL_ENABLE_DEBUG_INFO: NO
              MTL_FAST_MATH: YES
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
          targets:
            Spektrafilm:
              type: application
              platform: iOS
              sources:
                - path: Sources
              info:
                path: Resources/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
                  PRODUCT_NAME: ${APP_NAME}
                  ENABLE_PREVIEWS: NO
          EOF_PROJ

      - name: 4. Generate Xcode Project & Compile Unsigned iOS App (iPhone 13 Pro Max arm64)
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild clean build \
            -project Spektrafilm.xcodeproj \
            -scheme Spektrafilm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 5. Fake-Sign with ldid & Package Direct .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "Spektrafilm.app" -type d | head -n 1)
          echo "Located compiled bundle: ${APP_PATH}"
          ldid -S "${APP_PATH}/Spektrafilm"
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          zip -qry Spektrafilm-iOS-iPhone13ProMax.ipa Payload
          ls -lh Spektrafilm-iOS-iPhone13ProMax.ipa
          shasum -a 256 Spektrafilm-iOS-iPhone13ProMax.ipa > Spektrafilm-iOS-iPhone13ProMax.ipa.sha256

      - name: 6. Upload Uncompressed Artifact (Compression Level 0)
        uses: actions/upload-artifact@v4
        with:
          name: Spektrafilm-iOS-iPhone13ProMax-IPA
          path: |
            Spektrafilm-iOS-iPhone13ProMax.ipa
            Spektrafilm-iOS-iPhone13ProMax.ipa.sha256
          compression-level: 0
          if-no-files-found: error

      - name: 7. Publish Extraction-Free Direct .ipa to GitHub Releases (免解压直下)
        if: ${{ inputs.publish_release_ipa != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ios-build-${{ github.run_number }}"
          name: "Spektrafilm iOS (iPhone 13 Pro Max arm64) Build #${{ github.run_number }}"
          body: |
            ### Spektrafilm iOS Native Port (iPhone 13 Pro Max / A15 Bionic Metal)
            - **免解压直接安装**：在 iPhone 13 Pro Max 的 Safari 中直接点击下方 Assets 中的 `Spektrafilm-iOS-iPhone13ProMax.ipa` 即可直接下载 `.ipa` 原文件（无需二次解压 `.zip`），支持通过 **TrollStore / SideStore / AltStore / Sideloadly / 爱思助手** 一键签名或直装。
            - **核心管线**：基于 [andreavolpato/spektrafilm](https://github.com/andreavolpato/spektrafilm) 光谱胶片模拟管线（负片 → 放大机二向色滤光 → 相纸冲印 → 扫描仪），内置 120Hz ProMotion 与 Apple ProRAW (`.dng`) 线性解码支持。
          files: |
            Spektrafilm-iOS-iPhone13ProMax.ipa
            Spektrafilm-iOS-iPhone13ProMax.ipa.sha256
          prerelease: true

      - name: 8. Write Build & Direct Download Summary
        run: |
          cat << 'EOF_SUMMARY' >> $GITHUB_STEP_SUMMARY
          ## Spektrafilm iOS (iPhone 13 Pro Max) 编译完成
          - **目标硬件**：iPhone 13 Pro Max (`iPhone14,3`, Apple A15 Bionic 5-Core GPU, `arm64`, Display P3, 120Hz ProMotion)
          - **免解压 `.ipa` 获取方式**：
            1. **GitHub Releases 免解压直链（推荐）**：进入本仓库的 **Releases** 页面，直接点击 `Spektrafilm-iOS-iPhone13ProMax.ipa` 即可在 iPhone Safari 中免解压下载 `.ipa` 并导入 TrollStore / SideStore / AltStore。
            2. **Actions Artifacts**：在当前运行页底部下载 `Spektrafilm-iOS-iPhone13ProMax-IPA`（已设为 0 压缩率快速打包）。
          EOF_SUMMARY
