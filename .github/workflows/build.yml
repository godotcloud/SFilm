          @MainActor
          final class SpektrafilmViewModel: ObservableObject {
              @Published var uniforms = SpektrafilmUniforms()
              @Published var selectedFilmIndex: Int = 0 { didSet { applySelectedFilmStock() } }
              @Published var selectedPaperIndex: Int = 1 { didSet { applySelectedPrintPaper() } }
              @Published var selectedFormatIndex: Int = 3 {
                  didSet { uniforms.frameLongEdgeMM = SpektrafilmCatalog.filmFormats[selectedFormatIndex].longEdgeMM }
              }
              @Published var renderedUIImage: UIImage?
              @Published var imageMetadataSummary: String = "Spectral ColorChecker & 14-Stop Halation Target"

              let device: MTLDevice?
              private let commandQueue: MTLCommandQueue?
              private var pipelineState: MTLComputePipelineState?
              private var sourceTexture: MTLTexture?

              init() {
                  let dev = MTLCreateSystemDefaultDevice()
                  self.device = dev
                  self.commandQueue = dev?.makeCommandQueue()
                  if let dev = dev,
                     let library = dev.makeDefaultLibrary(),
                     let kernelFunc = library.makeFunction(name: "spektrafilm_pipeline") {
                      self.pipelineState = try? dev.makeComputePipelineState(function: kernelFunc)
                  }
                  applySelectedFilmStock()
                  let demoImage = Self.generateBuiltInTestScene(width: 1284, height: 960)
                  loadCGImage(demoImage, label: "Spectral ColorChecker & Gradation Target")
              }

              func applySelectedFilmStock() {
                  let stock = SpektrafilmCatalog.filmStocks[selectedFilmIndex]
                  uniforms.filmStockID = stock.id
                  uniforms.filmDmin = stock.dmin
                  uniforms.filmDmax = stock.dmax
                  uniforms.filmSlope = stock.slope
                  uniforms.filmSensShift = stock.sensShift
                  uniforms.filmHalationRatio = stock.halationRatio
                  uniforms.filmBaseRMSGranularity = stock.rmsGranularity
                  uniforms.filmIsReversal = stock.isReversal ? 1 : 0
                  uniforms.filmIsBlackAndWhite = stock.isBlackAndWhite ? 1 : 0
                  uniforms.filmIsTungsten = stock.isTungsten ? 1 : 0
                  if stock.isReversal {
                      selectedPaperIndex = 0
                  } else if let idx = SpektrafilmCatalog.printPapers.firstIndex(where: { $0.id == stock.defaultPaperID }) {
                      selectedPaperIndex = idx
                  }
                  applySelectedPrintPaper()
                  renderSimulation()
              }

              func applySelectedPrintPaper() {
                  let paper = SpektrafilmCatalog.printPapers[selectedPaperIndex]
                  uniforms.printPaperID = paper.id
                  uniforms.paperDmin = paper.dmin
                  uniforms.paperDmax = paper.dmax
                  uniforms.paperSlope = paper.slope
                  renderSimulation()
              }

              func loadPhotoData(_ data: Data, filename: String = "Imported Photo") {
                  if let rawFilter = CIRAWFilter(imageData: data, identifierHint: nil) {
                      rawFilter.isGamutMappingEnabled = false
                      rawFilter.baselineExposure = 0.0
                      rawFilter.boostAmount = 0.0
                      if let ciOut = rawFilter.outputImage {
                          let ctx = CIContext(options: [.workingColorSpace: CGColorSpace(name: CGColorSpace.extendedLinearDisplayP3) as Any])
                          if let cgImg = ctx.createCGImage(ciOut, from: ciOut.extent) {
                              loadCGImage(cgImg, label: "ProRAW/DNG Linear (\(Int(ciOut.extent.width))×\(Int(ciOut.extent.height)))")
                              return
                          }
                      }
                  }
                  if let uiImg = UIImage(data: data), let cgImg = uiImg.cgImage {
                      loadCGImage(cgImg, label: "\(filename) (\(cgImg.width)×\(cgImg.height))")
                  }
              }

              func loadCGImage(_ cgImage: CGImage, label: String) {
                  self.imageMetadataSummary = label
                  guard let dev = device else { return }
                  let loader = MTKTextureLoader(device: dev)
                  self.sourceTexture = try? loader.newTexture(cgImage: cgImage, options: [
                      .SRGB: false,
                      .textureUsage: NSNumber(value: MTLTextureUsage.shaderRead.rawValue)
                  ])
                  renderSimulation()
              }

              func renderSimulation() {
                  guard let dev = device, let queue = commandQueue, let pipeline = pipelineState, let inTex = sourceTexture else { return }
                  let width = inTex.width, height = inTex.height
                  let desc = MTLTextureDescriptor.texture2DDescriptor(pixelFormat: .rgba8Unorm, width: width, height: height, mipmapped: false)
                  desc.usage = [.shaderWrite, .shaderRead]
                  guard let outTex = dev.makeTexture(descriptor: desc),
                        let cmdBuf = queue.makeCommandBuffer(),
                        let encoder = cmdBuf.makeComputeCommandEncoder() else { return }

                  var u = uniforms
                  encoder.setComputePipelineState(pipeline)
                  encoder.setTexture(inTex, index: 0)
                  encoder.setTexture(outTex, index: 1)
                  encoder.setBytes(&u, length: MemoryLayout<SpektrafilmUniforms>.stride, index: 0)

                  let w = pipeline.threadExecutionWidth
                  let h = max(pipeline.maxTotalThreadsPerThreadgroup / w, 1)
                  encoder.dispatchThreads(MTLSize(width: width, height: height, depth: 1),
                                          threadsPerThreadgroup: MTLSize(width: w, height: h, depth: 1))
                  encoder.endEncoding()
                  cmdBuf.commit()
                  cmdBuf.waitUntilCompleted()

                  if let ciImage = CIImage(mtlTexture: outTex, options: [.colorSpace: CGColorSpace(name: CGColorSpace.displayP3) as Any]) {
                      let flipped = ciImage.transformed(by: CGAffineTransform(scaleX: 1, y: -1).translatedBy(x: 0, y: -ciImage.extent.height))
                      let ctx = CIContext()
                      if let cgOut = ctx.createCGImage(flipped, from: flipped.extent) {
                          self.renderedUIImage = UIImage(cgImage: cgOut)
                      }
                  }
              }

              static func generateBuiltInTestScene(width: Int, height: Int) -> CGImage {
                  let renderer = UIGraphicsImageRenderer(size: CGSize(width: width, height: height))
                  let img = renderer.image { ctx in
                      let cg = ctx.cgContext
                      let colors = [
                          UIColor(red: 0.14, green: 0.24, blue: 0.44, alpha: 1.0).cgColor,
                          UIColor(red: 0.85, green: 0.58, blue: 0.36, alpha: 1.0).cgColor,
                          UIColor(red: 0.12, green: 0.11, blue: 0.10, alpha: 1.0).cgColor
                      ] as CFArray
                      if let grad = CGGradient(colorsSpace: CGColorSpaceCreateDeviceRGB(), colors: colors, locations: [0.0, 0.55, 1.0]) {
                          cg.drawLinearGradient(grad, start: .zero, end: CGPoint(x: 0, y: height), options: [])
                      }
                      for i in 0..<14 {
                          let b = CGFloat(min(1.0, 0.25 + Double(i) * 0.065))
                          cg.setFillColor(UIColor(white: b, alpha: 1.0).cgColor)
                          cg.fillEllipse(in: CGRect(x: CGFloat(62 + i * 82), y: 55, width: 36, height: 36))
                      }
                      let patches: [(CGFloat, CGFloat, CGFloat)] = [
                          (0.45,0.32,0.27),(0.76,0.58,0.50),(0.38,0.48,0.62),(0.34,0.42,0.26),(0.52,0.50,0.69),(0.40,0.74,0.67),
                          (0.84,0.49,0.17),(0.31,0.36,0.65),(0.76,0.33,0.39),(0.37,0.24,0.42),(0.62,0.74,0.25),(0.88,0.64,0.18),
                          (0.22,0.24,0.59),(0.27,0.58,0.29),(0.69,0.21,0.24),(0.91,0.78,0.12),(0.73,0.34,0.58),(0.03,0.53,0.65),
                          (0.95,0.95,0.94),(0.78,0.78,0.78),(0.63,0.63,0.63),(0.48,0.48,0.48),(0.33,0.33,0.33),(0.18,0.18,0.18)
                      ]
                      let startX: CGFloat = (CGFloat(width) - 6.0 * 174.0) * 0.5
                      for r in 0..<4 {
                          for c in 0..<6 {
                              let p = patches[r * 6 + c]
                              cg.setFillColor(UIColor(red: p.0, green: p.1, blue: p.2, alpha: 1.0).cgColor)
                              cg.fill(CGRect(x: startX + CGFloat(c) * 174, y: 150 + CGFloat(r) * 134, width: 160, height: 120))
                          }
                      }
                      let stepW = CGFloat(width - 120) / 32.0
                      for s in 0..<32 {
                          let v = CGFloat(s) / 31.0
                          cg.setFillColor(UIColor(white: v, alpha: 1.0).cgColor)
                          cg.fill(CGRect(x: 60 + CGFloat(s) * stepW, y: 730, width: stepW + 1, height: 140))
                      }
                  }
                  return img.cgImage!
              }
          }
          EOF_CORE
          fi

